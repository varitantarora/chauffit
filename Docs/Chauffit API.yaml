      properties:
        pickup_location_id:
          type: string
          format: uuid
          nullable: true
          description: ID of saved pickup location (alternative to from_lat/from_long/from_address)
        dropoff_location_id:
          type: string
          format: uuid
          nullable: true
          description: ID of saved dropoff location (alternative to to_lat/to_long/to_address)
        from_lat:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,8})?$
          nullable: true
          description: Pickup latitude
        from_long:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,8})?$
          nullable: true
          description: Pickup longitude
        from_address:
          type: string
          description: Pickup address
          maxLength: 500
        to_lat:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,8})?$
          nullable: true
          description: Dropoff latitude
        to_long:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,8})?$
          nullable: true
          description: Dropoff longitude
        to_address:
          type: string
          description: Dropoff address
          maxLength: 500
        vehicle_id:
          type: string
          format: uuid
          description: Customer's car ID
        when:
          allOf:
          - $ref: '#/components/schemas/WhenEnum'
          default: now
          description: |-
            Book now or schedule for later

            * `now` - now
            * `schedule` - schedule
        type:
          allOf:
          - $ref: '#/components/schemas/TypeEnum'
          default: one_way
          description: |-
            Trip type: one_way, round_trip, hourly, or multi_stop

            * `one_way` - one_way
            * `round_trip` - round_trip
            * `hourly` - hourly
            * `multi_stop` - multi_stop
        hours:
          type: integer
          maximum: 12
          minimum: 1
          description: Number of hours for hourly rides (1-12)
        scheduled_at:
          type: string
          format: date-time
          nullable: true
          description: Scheduled pickup time (required when when='schedule')
