          items:
            $ref: '#/components/schemas/AdminPerKmRateRequest'
        per_min_rates:
          type: array
          items:
            $ref: '#/components/schemas/AdminPerMinRateRequest'
        hourly_rates:
          type: array
          items:
            $ref: '#/components/schemas/AdminHourlyHireRateRequest'
