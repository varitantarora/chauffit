components:
  schemas:
    AcceptRideRequest:
      type: object
      description: Serializer for accepting a ride.
      properties:
        ride_id:
          type: string
          format: uuid
          description: Booking ID to accept
      required:
      - ride_id
    AccountStatusEnum:
      enum:
      - active
      - inactive
      - pending_verification
      type: string
      description: |-
        * `active` - Active
        * `inactive` - Inactive
        * `pending_verification` - Pending Verification
    AccountTypeEnum:
      enum:
      - savings
      - current
      type: string
      description: |-
        * `savings` - Savings Account
        * `current` - Current Account
    ActionEnum:
      enum:
      - approve
      - reject
      type: string
      description: |-
        * `approve` - approve
        * `reject` - reject
    ActionTypeEnum:
      enum:
      - deeplink
      - web
      - none
      type: string
      description: |-
        * `deeplink` - Deeplink
        * `web` - Web
        * `none` - None
    AdminBikerTask:
      type: object
      description: Serializer for listing and managing biker tasks in admin panel.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        task_reference:
          type: string
          maxLength: 20
        booking_reference:
          type: string
          readOnly: true
        biker_name:
          type: string
          readOnly: true
          nullable: true
        task_status:
          $ref: '#/components/schemas/TaskStatusEnum'
        task_status_display:
          type: string
          readOnly: true
        priority:
          $ref: '#/components/schemas/Priority360Enum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - biker_name
      - booking_reference
      - created_at
      - id
      - task_reference
      - task_status_display
      - updated_at
    AdminHourlyHireRate:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        vehicle_segment:
          $ref: '#/components/schemas/VehicleSegmentEnum'
        base_1h:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        per_hour_after_1h:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      required:
      - base_1h
      - id
      - per_hour_after_1h
      - vehicle_segment
    AdminHourlyHireRateRequest:
      type: object
      properties:
        vehicle_segment:
          $ref: '#/components/schemas/VehicleSegmentEnum'
        base_1h:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        per_hour_after_1h:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      required:
      - base_1h
      - per_hour_after_1h
      - vehicle_segment
